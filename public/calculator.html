<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .calculator {
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid black;
        width: fit-content;
        padding: 5px 20px 20px 20px;
        gap: 20px;
        border-radius: 10px;
        background-color: #252525;
        color: #fff;
        margin: 100px auto 0 auto;
      }

      .calculator input {
        width: 200px;
        height: 30px;
        border-radius: 10px;
        padding: 2px 2px 2px 10px;
        border: none;
      }
      .calculator select {
        width: 210px;
        height: 33px;
        border-radius: 10px;
        padding: 2px 2px 2px 10px;
        border: none;
      }
      .calculator button {
        width: 210px;
        height: 33px;
        border-radius: 10px;
        padding: 2px 2px 2px 10px;
        background-color: blue;
        color: #fff;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>Calculator</h2>
      <input
        type="number"
        name="num1"
        id="num1"
        placeholder="enter a number"
        required
      />
      <input
        type="number"
        name="num2"
        id="num2"
        placeholder="enter a number"
        required
      />
      <select name="operation" id="operation" required>
        <option value="">Select an operation</option>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="/">/</option>
        <option value="*">*</option>
      </select>
      <button id="calculate">Calculate</button>
      <p id="resultDisplay"></p>
    </div>
    <script type="module" src="./build/calculator.js"></script>
  </body>
</html>
